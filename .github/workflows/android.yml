name: Android

on:
  push:
    branches: [main, master]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build, lint and domain tests
        run: bash gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --console=plain
      - name: Upload APK and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: borrowbuddy-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.html
