name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations and seed
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/stub_supabase.sql
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Run smoke test
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/smoke_test.sql

      - name: Validate campus availability privacy
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/mobile_availability.sql

      - name: Validate persistent handover attempt limits
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/handover_attempts.sql

      - name: Validate private handover secrets and public response privacy
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/private_handover_secrets.sql

      - name: Validate internal helper role boundaries
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/internal_helper_permissions.sql

      - name: Validate chat read cursors and channel privacy
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/chat_read_tracking.sql

      - name: Validate public reputation aggregates and privacy
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/public_profile_stats.sql

      - name: Validate member card stamps and privacy
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/profile_stamps.sql

      - name: Validate saved items privacy
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/wishlist.sql

      - name: Validate loan extensions and handover reminders
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/loan_extensions.sql

      - name: Validate notification privileges and email job
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/notification_email.sql

      - name: Validate impact stats
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/impact_stats.sql

      - name: Validate campus exchange security and scheduling contract
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/campus_contract.sql
      - name: Validate private profile fields
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/private_profile_fields.sql
      - name: Validate that deleting a profile signs the account out
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/deleted_profile_sessions.sql
      - name: Validate group chats, reactions, edits and unread counts
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/group_chats.sql
